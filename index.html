<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Habits</title>
  <style>
    :root { color-scheme: dark; background: #000; font: 12px Menlo, Monaco, "Courier New", monospace; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #000; }
    body { display: flex; justify-content: center; color: #fff; overflow: hidden; }
    main {
      width: min(100%, 390px); min-height: 100dvh;
      padding: max(250px, env(safe-area-inset-top)) 13px max(18px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 12px;
    }
    section { width: max-content; }
    h2 { margin: 0 0 6px; font: inherit; font-weight: 400; line-height: 1; color: #fff; }
    .heatmap {
      display: grid; grid-template-columns: repeat(25, 5px); grid-template-rows: repeat(7, 5px);
      grid-auto-flow: column; place-items: center; gap: 7px; width: max-content; margin-inline: auto;
    }
    .day { width: 5px; height: 5px; border-radius: 50%; background: #404040; }
    .day.done { background: #fff; }
  </style>
</head>
<body>
  <main id="tracker" aria-label="Habit tracker"></main>
  <script>
    // Ersätt namnen och datumen med dina fyra Obsidian-properties.
    const habits = [
      { name: "Träning", done: ["2026-08-01", "2026-08-03", "2026-08-05", "2026-08-08", "2026-08-10", "2026-08-12", "2026-08-15"] },
      { name: "Meditation", done: ["2026-08-02", "2026-08-04", "2026-08-06", "2026-08-07", "2026-08-09", "2026-08-11", "2026-08-13", "2026-08-14", "2026-08-16"] },
      { name: "Läsning", done: ["2026-07-30", "2026-08-01", "2026-08-02", "2026-08-06", "2026-08-09", "2026-08-12", "2026-08-16"] },
      { name: "Promenad", done: ["2026-07-29", "2026-07-31", "2026-08-03", "2026-08-04", "2026-08-08", "2026-08-11", "2026-08-14", "2026-08-15"] }
    ];
    const tracker = document.querySelector("#tracker");
    const today = new Date();
    today.setHours(12, 0, 0, 0);
    const isoDate = date => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    };
    habits.slice(0, 4).forEach(habit => {
      const section = document.createElement("section");
      const title = document.createElement("h2");
      const grid = document.createElement("div");
      const completed = new Set(habit.done);
      title.textContent = habit.name;
      grid.className = "heatmap";
      for (let offset = 174; offset >= 0; offset -= 1) {
        const date = new Date(today);
        date.setDate(today.getDate() - offset);
        const dot = document.createElement("span");
        dot.className = completed.has(isoDate(date)) ? "day done" : "day";
        grid.append(dot);
      }
      section.append(title, grid);
      tracker.append(section);
    });
  </script>
</body>
</html>
