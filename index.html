<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Habits</title>
  <style>
    :root { color-scheme: dark; background: #000; font: 12px Menlo, Monaco, "Courier New", monospace; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #000; }
    body { display: flex; justify-content: center; color: #fff; overflow: hidden; }
    main {
      width: min(100%, 390px); min-height: 100dvh;
      padding: max(325px, env(safe-area-inset-top)) 13px max(18px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 18px;
    }
    section { width: max-content; position: relative; }
    h2 { position: absolute; z-index: 1; top: -14px; left: 0; margin: 0; font: inherit; font-weight: 400; line-height: 1; color: #fff; }
    .heatmap {
      display: grid; grid-template-columns: repeat(25, 5px); grid-template-rows: repeat(7, 5px);
      grid-auto-flow: column; place-items: center; gap: 7px; width: max-content; margin-inline: auto;
    }
    .day { width: 5px; height: 5px; border-radius: 50%; background: #404040; }
    .day.done { background: #fff; }
    .day.readiness-low { background: #ff5f56; }
    .day.readiness-moderate { background: #ffbd2e; }
    .day.readiness-high { background: #27c93f; }
    .day.no-data { visibility: hidden; }
  </style>
</head>
<body>
  <main id="tracker" aria-label="Habit tracker"></main>
  <script src="habits-data.js"></script>
  <script>
    const habits = window.habitsData ?? [];
    const readinessStart = window.readinessStart;
    const readiness = window.readinessData ?? {};
    const tracker = document.querySelector("#tracker");
    const currentDay = new Date();
    currentDay.setHours(12, 0, 0, 0);
    const isoDate = date => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    };
    const parseDate = value => {
      const [year, month, day] = value.split("-").map(Number);
      const date = new Date(year, month - 1, day, 12);
      return Number.isNaN(date.getTime()) ? null : date;
    };
    const appendHeatmap = (name, dates, classForDate, labelForDate) => {
      const section = document.createElement("section");
      const title = document.createElement("h2");
      const grid = document.createElement("div");
      title.textContent = name;
      grid.className = "heatmap";
      for (const date of dates) {
        const dot = document.createElement("span");
        const key = isoDate(date);
        dot.className = `day ${classForDate(key)}`.trim();
        const label = labelForDate?.(key);
        if (label) {
          dot.title = label;
          dot.setAttribute("aria-label", label);
        }
        grid.append(dot);
      }
      section.append(title, grid);
      tracker.append(section);
    };
    habits.slice(0, 4).forEach(habit => {
      const completed = new Set(habit.done);
      const start = parseDate(habit.start);
      const dates = [];
      if (start) {
        for (const date = new Date(start); date <= currentDay; date.setDate(date.getDate() + 1)) {
          dates.push(new Date(date));
        }
      }
      appendHeatmap(habit.name, dates, date => completed.has(date) ? "done" : "");
    });
    const readinessDates = [];
    const readinessFirstDay = parseDate(readinessStart);
    if (readinessFirstDay) {
      for (const date = new Date(readinessFirstDay); date <= currentDay; date.setDate(date.getDate() + 1)) {
        readinessDates.push(new Date(date));
      }
    }
    appendHeatmap(
      "Dagsform",
      readinessDates,
      date => {
        const score = readiness[date];
        if (!Number.isFinite(score)) return "no-data";
        if (score >= 65) return "readiness-high";
        if (score >= 30) return "readiness-moderate";
        return "readiness-low";
      },
      date => Number.isFinite(readiness[date]) ? `${date} · Dagsform ${readiness[date]}` : "",
    );
  </script>
</body>
</html>
