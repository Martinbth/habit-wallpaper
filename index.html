<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Habits</title>
  <style>
    :root { color-scheme: dark; background: #000; font: 12px Menlo, Monaco, "Courier New", monospace; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #000; }
    body { display: flex; justify-content: center; color: #fff; overflow: hidden; }
    main {
      width: min(100%, 390px); min-height: 100dvh;
      padding: max(325px, env(safe-area-inset-top)) 13px max(18px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 12px;
    }
    section { width: max-content; position: relative; }
    h2 { position: absolute; z-index: 1; top: -3px; left: 0; margin: 0; font: inherit; font-weight: 400; line-height: 1; color: #fff; }
    .heatmap {
      display: grid; grid-template-columns: repeat(25, 5px); grid-template-rows: repeat(7, 5px);
      grid-auto-flow: column; place-items: center; gap: 7px; width: max-content; margin-inline: auto;
    }
    .day { width: 5px; height: 5px; border-radius: 50%; background: #404040; }
    .day.done { background: #fff; }
    .day.label-space { visibility: hidden; }
  </style>
</head>
<body>
  <main id="tracker" aria-label="Habit tracker"></main>
  <script src="habits-data.js"></script>
  <script>
    const habits = window.habitsData ?? [];
    const tracker = document.querySelector("#tracker");
    const today = new Date();
    today.setHours(12, 0, 0, 0);
    const isoDate = date => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    };
    habits.slice(0, 4).forEach(habit => {
      const section = document.createElement("section");
      const title = document.createElement("h2");
      const grid = document.createElement("div");
      const completed = new Set(habit.done);
      title.textContent = habit.name;
      grid.className = "heatmap";
      const labelColumns = Math.ceil((habit.name.length * 7.2 + 8) / 12);
      let index = 0;
      for (let offset = 174; offset >= 0; offset -= 1) {
        const date = new Date(today);
        date.setDate(today.getDate() - offset);
        const dot = document.createElement("span");
        dot.className = completed.has(isoDate(date)) ? "day done" : "day";
        if (index % 7 === 0 && index / 7 < labelColumns) dot.classList.add("label-space");
        grid.append(dot);
        index += 1;
      }
      section.append(title, grid);
      tracker.append(section);
    });
  </script>
</body>
</html>
